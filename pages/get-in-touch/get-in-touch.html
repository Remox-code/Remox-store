<!doctype html>
<html>
  <head>
    <title>تماس با ما</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <link type="text/css" rel="stylesheet" href="get in touch.css" />
    <link type="text/css" rel="stylesheet" href="../../all-css/all-body.css" />
    <link
      type="text/css"
      rel="stylesheet"
      href="../../all-css/all-header.css"
    />
    <link
      type="text/css"
      rel="stylesheet"
      href="../../all-css/all-footer.css"
    />
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="header"></div>
    <div id="category-nav"></div>

    <main class="contact-wrapper">
      <section class="contact-container reveal">
        <!-- بخش سمت راست: اطلاعات تماس -->
        <div class="contact-info">
          <h2 class="glow-text">ارتباط با ما</h2>
          <p class="subtitle">ما اینجا هستیم تا به سوالات شما پاسخ دهیم</p>

          <div class="contact-methods">
            <a href="https://t.me/Remox-4" class="method-item">
              <div class="icon-box telegram">
                <i class="fab fa-telegram-plane"></i>
              </div>
              <div class="method-text">
                <span>تلگرام</span>
                <p>@Remox_4</p>
              </div>
            </a>

            <a href="https://instagram.com/Remox.code" class="method-item">
              <div class="icon-box instagram">
                <i class="fab fa-instagram"></i>
              </div>
              <div class="method-text">
                <span>اینستاگرام</span>
                <p>@Remox.code</p>
              </div>
            </a>

            <a href="tel:09146583542" class="method-item">
              <div class="icon-box call"><i class="fas fa-phone-alt"></i></div>
              <div class="method-text">
                <span>تماس تلفنی</span>
                <p>09146583542</p>
              </div>
            </a>

            <a href="mailto:remoxafficial.4@gmail.com" class="method-item">
              <div class="icon-box email"><i class="fas fa-envelope"></i></div>
              <div class="method-text">
                <span>ایمیل</span>
                <p>remoxafficial.4@gmail.com</p>
              </div>
            </a>
          </div>
        </div>

        <!-- بخش سمت چپ: فرم تماس -->
        <div class="contact-form-card">
          <h3>ارسال پیام مستقیم</h3>
          <form id="contactForm">
            <div class="input-group">
              <input type="text" id="name" required />
              <label>نام و نام خانوادگی</label>
            </div>
            <div class="input-group">
              <input type="email" id="email" required />
              <label>ایمیل یا شماره تماس</label>
            </div>
            <div class="input-group">
              <textarea id="message" rows="5" required></textarea>
              <label>متن پیام شما</label>
            </div>
            <button type="submit" class="submit-btn">
              <span>ارسال پیام</span>
              <i class="fas fa-paper-plane"></i>
            </button>
          </form>
        </div>
      </section>
    </main>

    <div id="footer"></div>

    <script>
      window.BASE_PATH = "../../";
    </script>
    <script src="../../all-js/loader.js"></script>
    <script src="get in touch.js"></script>
  </body>
</html>
