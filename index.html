<!doctype html>
<html>
  <head>
    <title>خانه | Remox Store</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link type="text/css" rel="stylesheet" href="home/home.css" />
    <link type="text/css" rel="stylesheet" href="all-css/all-body.css" />
    <link type="text/css" rel="stylesheet" href="all-css/all-footer.css" />
    <link type="text/css" rel="stylesheet" href="all-css/all-header.css" />
    <meta charset="UTF-8" />
  </head>
  <body>
    <div id="header"></div>
    <div id="category-nav"></div>

    <main>
      <section id="hero"></section>

      <section id="values">
        <h2>چرا RemoxStore؟</h2>
        <div class="features-container"></div>
      </section>

      <section id="categories">
        <h2>کالکشن‌های ما</h2>
        <div class="category-list"></div>
      </section>

      <section id="about"></section>

      <section id="trending">
        <h2>محصولات منتخب</h2>
        <div class="products-wrapper">
          <button class="slider-nav prev">
            <i class="fas fa-chevron-left"></i>
          </button>
          <div class="products-grid"></div>
          <button class="slider-nav next">
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </section>

      <section id="testimonials">
        <h2>تجربه همراهان ما</h2>
        <div class="testimonials-row"></div>
      </section>

      <section id="newsletter"></section>
    </main>

    <div id="footer"></div>

    <script>
      window.BASE_PATH = "";
    </script>
    <script src="all-js/loader.js"></script>
    <script type="module" src="home/home.js"></script>
  </body>
</html>
